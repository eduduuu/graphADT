name: Run Tests and Deploy Dashboards

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tests-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib openpyxl plotly

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake

      - name: Build and Test ADJACENCY_LIST
        run: |
          rm -rf build
          cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -DIMPLEMENTATION=ADJACENCY_LIST
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure

      - name: Build and Test ADJACENCY_MATRIX
        run: |
          rm -rf build
          cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -DIMPLEMENTATION=ADJACENCY_MATRIX
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure

      - name: Build and Test CSR
        run: |
          rm -rf build
          cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -DIMPLEMENTATION=CSR
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure

      - name: Generate Dashboards
        run: |
          cd report
          # Reads the CSV from the benchmark folder relative to the report folder
          python generate_dashboards.py ../benchmark/micro_benchmark.csv

      - name: Create index.html
        run: |
          cat << 'EOF' > report/index.html
          <!DOCTYPE html>
          <html>
          <head><title>Benchmark Dashboards</title></head>
          <body>
              <h1>Graph Benchmark Results</h1>
              <ul>
                  <li><a href="dashboard_all_in_one.html">Global Architecture Comparison</a></li>
                  <li><a href="dashboard_1_size.html">Dashboard 1: Fixed by Size</a></li>
                  <li><a href="dashboard_2_density.html">Dashboard 2: Fixed by Density</a></li>
                  <li><a href="dashboard_3_workload.html">Dashboard 3: Fixed by Workload</a></li>
              </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './report'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4